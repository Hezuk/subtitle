<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>자막 편집기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #09090b;
      color: #fafafa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    #header {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: .55rem 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #header h2 {
      font-size: .875rem;
      font-weight: 700;
      color: #fafafa;
    }

    .hbtn {
      background: none;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: .75rem;
      font-weight: 600;
      padding: .3rem .7rem;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      width: auto;
      margin: 0;
    }
    .hbtn:hover { border-color: #818cf8; color: #818cf8; }
    .hbtn.primary { background: #818cf8; border-color: #818cf8; color: #fff; }
    .hbtn.primary:hover { background: #6366f1; }
    .hbtn.primary:disabled { opacity: .5; cursor: not-allowed; }

    /* Overflow menu (⋯) */
    .overflow-wrap { position: relative; }
    .overflow-btn {
      background: none;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: 1rem;
      font-weight: 700;
      width: 32px;
      height: 28px;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }
    .overflow-btn:hover { border-color: #818cf8; color: #818cf8; }
    #overflow-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      min-width: 200px;
      z-index: 100;
      overflow: hidden;
    }
    #overflow-menu.open { display: block; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .65rem 1rem;
      font-size: .875rem;
      color: #a1a1aa;
      cursor: pointer;
      transition: background .12s;
      border-bottom: 1px solid #1f1f23;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: #1f1f23; color: #fafafa; }
    .menu-divider {
      height: 1px;
      background: #27272a;
      margin: 0;
    }
    .menu-label {
      font-size: .75rem;
      color: #52525b;
      padding: .45rem 1rem .2rem;
      font-weight: 600;
    }
    .menu-item .mi-icon { font-size: .75rem; font-weight: 700; color: #71717a; flex-shrink: 0; min-width: 24px; text-align: center; }
    .menu-item .mi-desc { font-size: .75rem; color: #52525b; margin-top: .1rem; }
    .menu-item.danger { color: #f87171; }
    .menu-item.danger:hover { background: rgba(248,113,113,.08); }

    /* Language selector */
    .lang-group {
      display: flex;
      gap: .25rem;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: .2rem;
    }
    .lang-tab {
      background: none;
      border: none;
      color: #71717a;
      font-size: .75rem;
      font-weight: 700;
      padding: .25rem .65rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      width: auto;
      margin: 0;
    }
    .lang-tab:hover { color: #a1a1aa; }
    .lang-tab.active-en   { background: #818cf8; color: #fff; }
    .lang-tab.active-ko   { background: #38bdf8; color: #09090b; }
    .lang-tab.active-both { background: #818cf8; color: #fff; }

    .spacer { flex: 1; }

    #save-status {
      font-size: .75rem;
      color: #71717a;
      min-width: 60px;
      text-align: right;
    }
    #save-status.saved  { color: #34d399; }
    #save-status.saving { color: #fbbf24; }
    #save-status.error  { color: #f87171; }

    /* Search + jump */
    #toolbar {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: .45rem 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-shrink: 0;
    }
    .toolbar-input {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 7px;
      color: #fafafa;
      font-size: .875rem;
      padding: .3rem .65rem;
      outline: none;
      transition: border-color .15s;
    }
    .toolbar-input:focus { border-color: #818cf8; }
    .toolbar-input::placeholder { color: #52525b; }
    #search-input  { flex: 1; }
    #jump-input-h  { width: 90px; }
    #match-count   { font-size: .75rem; color: #71717a; white-space: nowrap; }

    .hidden { display: none !important; }

    /* Block list */
    #block-list {
      flex: 1;
      overflow-y: auto;
      padding: .6rem .9rem;
    }

    .block {
      display: flex;
      gap: .65rem;
      padding: .55rem .7rem;
      border-radius: 8px;
      margin-bottom: .35rem;
      border: 1px solid transparent;
      transition: border-color .15s, background .15s;
    }
    .block:hover   { background: #141416; border-color: #27272a; }
    .block.focused { border-color: #818cf8; background: rgba(129,140,248,.04); }
    .block.highlight { background: rgba(56,189,248,.05); border-color: rgba(56,189,248,.25); }

    .block-meta {
      flex-shrink: 0;
      text-align: right;
      min-width: 84px;
    }
    .block-idx  { font-size: .75rem; color: #52525b; font-weight: 700; margin-bottom: .15rem; }
    .block-time { font-size: .75rem; color: #52525b; line-height: 1.4; }

    .block-fields { flex: 1; display: flex; flex-direction: column; gap: .3rem; }

    .field-wrap { position: relative; }
    .field-label {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .04em;
      margin-bottom: .15rem;
    }
    .field-label.en { color: #818cf8; }
    .field-label.ko { color: #38bdf8; }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #fafafa;
      font-size: .875rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
      min-height: 1.5em;
      overflow: hidden;
    }
    textarea.ko-ta { color: #a1a1aa; }
    textarea:focus { color: #f4f4f5; }

    .char-count {
      font-size: .75rem;
      color: #52525b;
      text-align: right;
    }
    .char-count.warn { color: #fbbf24; }
    .char-count.over { color: #f87171; }

    #empty-msg {
      text-align: center;
      color: #52525b;
      padding: 4rem 1rem;
      font-size: .875rem;
    }

    .retranslate-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: 1px solid #27272a;
      color: #52525b;
      font-size: .75rem;
      padding: .15rem .4rem;
      border-radius: 5px;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: all .15s;
    }
    .retranslate-btn:hover { border-color: #818cf8; color: #818cf8; }

    .retranslate-panel {
      display: none;
      margin-top: .35rem;
      gap: .4rem;
      align-items: center;
    }
    .retranslate-panel.open { display: flex; }
    .retranslate-req {
      flex: 1;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #fafafa;
      font-size: .75rem;
      padding: .25rem .5rem;
      outline: none;
      transition: border-color .15s;
    }
    .retranslate-req:focus { border-color: #818cf8; }
    .retranslate-req::placeholder { color: #52525b; }
    .retranslate-go {
      background: #818cf8;
      border: none;
      color: #fff;
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .65rem;
      border-radius: 6px;
      cursor: pointer;
      width: auto;
      margin: 0;
      white-space: nowrap;
      transition: background .15s;
    }
    .retranslate-go:hover { background: #6366f1; }
    .retranslate-go:disabled { opacity: .5; cursor: not-allowed; }

    /* Focus styles */
    button:focus-visible, .hbtn:focus-visible, .lang-tab:focus-visible,
    .toolbar-input:focus-visible, textarea:focus-visible,
    .retranslate-req:focus-visible, .retranslate-go:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }

    /* Inline error toast */
    .inline-error {
      font-size: .75rem;
      color: #f87171;
      margin-top: .2rem;
      animation: fadeIn .2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div id="header">
    <h2>자막 편집기</h2>

    <div class="lang-group">
      <button class="lang-tab active-en" data-lang="en">EN</button>
      <button class="lang-tab" data-lang="ko">KO</button>
      <button class="lang-tab" data-lang="both">Both</button>
    </div>

    <div class="spacer"></div>

    <button class="hbtn primary" id="btn-save">저장 (Ctrl+S)</button>
    <span id="save-status" aria-live="polite"></span>

    <div class="overflow-wrap">
      <button class="overflow-btn" id="btn-overflow" aria-label="더보기 메뉴">⋯</button>
      <div id="overflow-menu">
        <div class="menu-label">가져오기</div>
        <div class="menu-item" data-import="en">
          <span class="mi-icon">EN</span>
          <div><div>영어 자막으로 가져오기</div><div class="mi-desc">.srt 파일 선택</div></div>
        </div>
        <div class="menu-item" data-import="ko">
          <span class="mi-icon">KO</span>
          <div><div>한국어 자막으로 가져오기</div><div class="mi-desc">.srt 파일 선택</div></div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-label">내보내기</div>
        <div class="menu-item" data-export="en">
          <span class="mi-icon">EN</span>
          <div><div>영어 자막</div><div class="mi-desc">subtitle_en.srt</div></div>
        </div>
        <div class="menu-item" data-export="ko">
          <span class="mi-icon">KO</span>
          <div><div>한국어 자막</div><div class="mi-desc">subtitle_ko.srt</div></div>
        </div>
        <div class="menu-item" data-export="both">
          <span class="mi-icon">All</span>
          <div><div>한국어 + 영어 동시</div><div class="mi-desc">subtitle_bilingual.srt</div></div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item danger" id="btn-reset">
          <div>되돌리기</div>
        </div>
      </div>
    </div>
    <input type="file" id="import-file-input" accept=".srt" class="hidden" />
  </div>

  <div id="toolbar">
    <input class="toolbar-input" id="search-input" type="text" placeholder="자막 검색..." aria-label="자막 검색" />
    <span id="match-count"></span>
    <input class="toolbar-input" id="jump-input-h" type="number" min="1" placeholder="번호 이동" aria-label="블록 번호로 이동" />
  </div>

  <div id="block-list">
    <div id="empty-msg">자막을 불러오는 중...</div>
  </div>

  <script src="/shared.js"></script>
  <script>
    const jobId = getJobId();

    const blockList   = document.getElementById('block-list');
    const searchInput = document.getElementById('search-input');
    const matchCount  = document.getElementById('match-count');
    const saveStatus  = document.getElementById('save-status');
    const btnSave     = document.getElementById('btn-save');
    const btnReset    = document.getElementById('btn-reset');
    const jumpInputH  = document.getElementById('jump-input-h');

    let enBlocks = [], koBlocks = [];
    let origEn = [], origKo = [];
    let lang = 'en';   // 'en' | 'ko' | 'both'

    // ── 언어 탭 ──
    document.querySelectorAll('.lang-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        lang = tab.dataset.lang;
        document.querySelectorAll('.lang-tab').forEach(t => {
          t.className = 'lang-tab' + (t.dataset.lang === lang ? ` active-${lang}` : '');
        });
        applySearch(searchInput.value.trim());
      });
    });

    // ── 로드 ──
    async function load() {
      if (!jobId) { document.getElementById('empty-msg').textContent = LABELS.INVALID_ACCESS; return; }
      try {
        const [dataEn, dataKo] = await Promise.all([
          api(`/subtitles/${jobId}`),
          api(`/subtitles_ko/${jobId}`),
        ]);
        enBlocks = dataEn.blocks || [];
        koBlocks = dataKo.blocks || [];
        origEn = JSON.parse(JSON.stringify(enBlocks));
        origKo = JSON.parse(JSON.stringify(koBlocks));
        render(enBlocks, koBlocks);
      } catch (e) {
        document.getElementById('empty-msg').textContent = LABELS.LOAD_FAILED + ': ' + e.message;
      }
    }

    // ── 렌더링 ──
    function render(enList, koList) {
      blockList.innerHTML = '';
      const list = lang === 'ko' ? koList : enList;
      if (!list.length) {
        blockList.innerHTML = `<div id="empty-msg">${LABELS.NO_SUBTITLES}</div>`;
        return;
      }

      // idx → block 맵
      const koMap = Object.fromEntries(koList.map(b => [b.idx, b]));
      const enMap = Object.fromEntries(enList.map(b => [b.idx, b]));

      list.forEach(b => {
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.idx = b.idx;

        const [start, end] = b.timestamp.split(' --> ');
        div.innerHTML = `
          <div class="block-meta">
            <div class="block-idx">#${b.idx}</div>
            <div class="block-time">${fmtTime(start)}<br>→ ${fmtTime(end)}</div>
          </div>
          <div class="block-fields"></div>
        `;
        const fields = div.querySelector('.block-fields');

        if (lang === 'en' || lang === 'both') {
          const enBlock = enMap[b.idx];
          if (enBlock) fields.appendChild(makeField('en', enBlock, enBlocks));
        }
        if (lang === 'ko' || lang === 'both') {
          const koBlock = koMap[b.idx];
          if (koBlock) fields.appendChild(makeField('ko', koBlock, koBlocks));
        }

        blockList.appendChild(div);
      });

      // DOM 삽입 후 전체 textarea 높이 재계산
      blockList.querySelectorAll('textarea').forEach(autoResize);
    }

    function makeField(type, block, arr) {
      const wrap = document.createElement('div');
      wrap.className = 'field-wrap';

      const label = document.createElement('div');
      label.className = `field-label ${type}`;
      label.textContent = type === 'en' ? 'EN' : 'KO';
      if (lang !== 'both') label.classList.add('hidden');

      const ta = document.createElement('textarea');
      ta.className = type === 'ko' ? 'ko-ta' : '';
      ta.value = block.text;
      ta.rows = 1;

      const cc = document.createElement('div');
      cc.className = 'char-count';

      wrap.appendChild(label);
      wrap.appendChild(ta);
      wrap.appendChild(cc);

      // 영어 블록에만 재번역 버튼 추가
      if (type === 'en') {
        const rtBtn = document.createElement('button');
        rtBtn.className = 'retranslate-btn';
        rtBtn.textContent = '재번역';

        const panel = document.createElement('div');
        panel.className = 'retranslate-panel';

        const reqInput = document.createElement('input');
        reqInput.type = 'text';
        reqInput.className = 'retranslate-req';
        reqInput.placeholder = '요구사항 입력 (선택)...';

        const goBtn = document.createElement('button');
        goBtn.className = 'retranslate-go';
        goBtn.textContent = LABELS.TRANSLATE;

        panel.appendChild(reqInput);
        panel.appendChild(goBtn);
        wrap.appendChild(rtBtn);
        wrap.appendChild(panel);

        rtBtn.addEventListener('click', () => {
          panel.classList.toggle('open');
          if (panel.classList.contains('open')) reqInput.focus();
        });

        const doRetranslate = async () => {
          goBtn.disabled = true;
          goBtn.textContent = LABELS.TRANSLATING;
          try {
            const data = await apiPost(`/retranslate/${jobId}`, {
              idx: block.idx, requirement: reqInput.value.trim(),
            });
            if (data.text) {
              ta.value = data.text;
              autoResize(ta);
              updateCC(ta, cc);
              const b = arr.find(x => x.idx === block.idx);
              if (b) b.text = data.text;
              panel.classList.remove('open');
              reqInput.value = '';
            }
          } catch (e) {
            // 인라인 에러 표시 (alert 대신)
            let errEl = panel.querySelector('.inline-error');
            if (!errEl) { errEl = document.createElement('div'); errEl.className = 'inline-error'; panel.appendChild(errEl); }
            errEl.textContent = LABELS.RETRANSLATE_FAILED + ': ' + e.message;
            setTimeout(() => errEl.remove(), 5000);
          } finally {
            goBtn.disabled = false;
            goBtn.textContent = LABELS.TRANSLATE;
          }
        };

        goBtn.addEventListener('click', doRetranslate);
        reqInput.addEventListener('keydown', e => { if (e.key === 'Enter') doRetranslate(); });
      }

      autoResize(ta);
      updateCC(ta, cc);

      ta.addEventListener('input', () => {
        autoResize(ta);
        updateCC(ta, cc);
        const b = arr.find(x => x.idx === block.idx);
        if (b) b.text = ta.value;
      });
      ta.addEventListener('focus', () => {
        const div = ta.closest('.block');
        div && div.classList.add('focused');
      });
      ta.addEventListener('blur', () => {
        const div = ta.closest('.block');
        div && div.classList.remove('focused');
      });
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const all = [...blockList.querySelectorAll('textarea')];
          const cur = all.indexOf(ta);
          const next = e.shiftKey ? all[cur - 1] : all[cur + 1];
          if (next) { next.focus(); next.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        }
      });
      return wrap;
    }

    function autoResize(ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    function updateCC(ta, el) {
      const lines = ta.value.split('\n');
      const max   = Math.max(...lines.map(l => l.length));
      el.className = 'char-count' + (max > 50 ? ' over' : max > 42 ? ' warn' : '');
      el.textContent = lines.length > 1
        ? lines.map(l => l.length).join(' / ') + LABELS.CHAR_UNIT
        : max + LABELS.CHAR_UNIT;
    }

    function fmtTime(t) {
      const [hms, ms] = t.split(',');
      const [h, m, s] = hms.split(':').map(Number);
      const tot = h * 3600 + m * 60 + s;
      return `${Math.floor(tot/60)}:${(tot%60).toString().padStart(2,'0')}.${ms[0]}`;
    }

    // ── 저장 ──
    async function save() {
      btnSave.disabled = true;
      saveStatus.className = 'saving';
      saveStatus.textContent = LABELS.SAVING;
      try {
        const tasks = [];
        if (lang === 'en' || lang === 'both') {
          tasks.push(apiPost(`/subtitles/${jobId}`, { blocks: enBlocks }));
        }
        if (lang === 'ko' || lang === 'both') {
          tasks.push(apiPost(`/subtitles_ko/${jobId}`, { blocks: koBlocks }));
        }
        await Promise.all(tasks);
        saveStatus.className = 'saved';
        saveStatus.textContent = LABELS.SAVED;
        broadcastSubtitleUpdated(jobId);
        // fallback: opener가 있으면 기존 방식도 유지
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: MSG.SUBTITLE_UPDATED }, '*');
        }
        setTimeout(() => { saveStatus.textContent = ''; saveStatus.className = ''; }, 2000);
      } catch (err) {
        saveStatus.className = 'error';
        saveStatus.textContent = err.message || LABELS.SAVE_FAILED;
      } finally {
        btnSave.disabled = false;
      }
    }

    // ── 되돌리기 ──
    btnReset.addEventListener('click', () => {
      overflowMenu.classList.remove('open');
      if (!confirm(LABELS.RESET_CONFIRM)) return;
      enBlocks = JSON.parse(JSON.stringify(origEn));
      koBlocks = JSON.parse(JSON.stringify(origKo));
      applySearch(searchInput.value.trim());
    });

    // ── Ctrl+S ──
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
    });
    btnSave.addEventListener('click', save);

    // ── 검색 ──
    searchInput.addEventListener('input', () => applySearch(searchInput.value.trim()));

    function applySearch(q) {
      const enList = q ? enBlocks.filter(b => b.text.toLowerCase().includes(q.toLowerCase())) : enBlocks;
      const koList = q ? koBlocks.filter(b => b.text.toLowerCase().includes(q.toLowerCase())) : koBlocks;
      const idxSet = new Set([...enList.map(b=>b.idx), ...koList.map(b=>b.idx)]);
      const filtered = (lang === 'ko' ? koBlocks : enBlocks).filter(b => idxSet.has(b.idx));
      matchCount.textContent = q ? `${filtered.length}개 일치` : '';
      render(
        q ? enBlocks.filter(b => idxSet.has(b.idx)) : enBlocks,
        q ? koBlocks.filter(b => idxSet.has(b.idx)) : koBlocks,
      );
      if (q) blockList.querySelectorAll('.block').forEach(d => d.classList.add('highlight'));
    }

    // ── 번호로 이동 ──
    jumpInputH.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const target = blockList.querySelector(`.block[data-idx="${jumpInputH.value}"]`);
        if (target) {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          target.querySelector('textarea')?.focus();
        }
        jumpInputH.value = '';
      }
    });

    // ── 더보기(⋯) 오버플로 메뉴 ──
    const btnOverflow  = document.getElementById('btn-overflow');
    const overflowMenu = document.getElementById('overflow-menu');
    const importInput  = document.getElementById('import-file-input');
    let importTarget   = 'en';

    btnOverflow.addEventListener('click', (e) => {
      e.stopPropagation();
      overflowMenu.classList.toggle('open');
    });
    document.addEventListener('click', () => overflowMenu.classList.remove('open'));

    // 가져오기
    document.querySelectorAll('[data-import]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        importTarget = item.dataset.import;
        overflowMenu.classList.remove('open');
        importInput.value = '';
        importInput.click();
      });
    });

    importInput.addEventListener('change', () => {
      const file = importInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const parsed = parseSRT(e.target.result);
        if (!parsed.length) { alert(LABELS.IMPORT_PARSE_ERROR); return; }
        if (importTarget === 'en') {
          enBlocks = parsed;
        } else {
          koBlocks = parsed;
        }
        applySearch(searchInput.value.trim());
        saveStatus.className = '';
        saveStatus.textContent = `✓ ${file.name} 가져옴`;
        setTimeout(() => { saveStatus.textContent = ''; }, 2500);
      };
      reader.readAsText(file, 'utf-8');
    });

    function parseSRT(text) {
      const blocks = [];
      const pattern = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,.]\d{3} --> \d{2}:\d{2}:\d{2}[,.]\d{3})\r?\n([\s\S]*?)(?=\r?\n\r?\n\d+\r?\n|$)/g;
      let m;
      while ((m = pattern.exec(text.trim())) !== null) {
        const ts = m[2].replace(/\./g, ',');
        blocks.push({ idx: m[1], timestamp: ts, text: m[3].trim() });
      }
      return blocks;
    }

    // 내보내기
    document.querySelectorAll('[data-export]').forEach(item => {
      item.addEventListener('click', () => {
        overflowMenu.classList.remove('open');
        exportSRT(item.dataset.export);
      });
    });

    function blocksToSRT(blocks) {
      return blocks.map(b => `${b.idx}\n${b.timestamp}\n${b.text}`).join('\n\n') + '\n';
    }

    function exportSRT(type) {
      let content, filename;
      if (type === 'en') {
        content  = blocksToSRT(enBlocks);
        filename = 'subtitle_en.srt';
      } else if (type === 'ko') {
        content  = blocksToSRT(koBlocks);
        filename = 'subtitle_ko.srt';
      } else {
        // 동시: 영어 위, 한국어 아래
        const koMap = Object.fromEntries(koBlocks.map(b => [b.idx, b.text]));
        const merged = enBlocks.map(b => ({
          idx: b.idx,
          timestamp: b.timestamp,
          text: `${b.text}\n${koMap[b.idx] || ''}`,
        }));
        content  = blocksToSRT(merged);
        filename = 'subtitle_bilingual.srt';
      }
      const blob = new Blob([content], { type: 'text/plain; charset=utf-8' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ── 플레이어에서 갱신 요청 ──
    window.addEventListener('message', e => {
      if (e.data?.type === MSG.RELOAD_SUBTITLE || e.data?.type === 'reload_subtitles') load();
    });

    load();
  </script>
</body>
</html>

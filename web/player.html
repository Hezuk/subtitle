<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>영상 플레이어</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #09090b;
      color: #fafafa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #title-bar {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: .5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #title-bar h2 {
      font-size: .875rem;
      font-weight: 600;
      color: #fafafa;
    }
    #status-label {
      font-size: .75rem;
      color: #71717a;
      background: #1f1f23;
      padding: .25rem .7rem;
      border-radius: 99px;
      border: 1px solid #27272a;
    }

    #video-area {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #preview-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #waiting-msg {
      position: absolute;
      text-align: center;
      color: #71717a;
    }
    #waiting-msg .icon { font-size: 3rem; margin-bottom: .75rem; }
    #waiting-msg p { font-size: .875rem; }

    /* Controls */
    .controls {
      background: #111113;
      border-top: 1px solid #1f1f23;
      padding: .7rem 1rem;
      flex-shrink: 0;
    }
    .seek-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .5rem;
    }
    .time-label {
      font-size: .75rem;
      color: #71717a;
      white-space: nowrap;
      min-width: 40px;
    }
    .time-label.right { text-align: right; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 99px;
      background: #27272a;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #818cf8;
      cursor: pointer;
    }
    input[type="range"].volume-slider {
      height: 3px;
      width: 80px;
      flex: none;
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 1.1rem;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      padding: 0;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.08); color: #fafafa; }
    .ctrl-btn.play-btn {
      background: #818cf8;
      color: #fff;
      width: 42px;
      height: 42px;
      font-size: 1.3rem;
    }
    .ctrl-btn.play-btn:hover { background: #6366f1; }
    .spacer { flex: 1; }
    .volume-row { display: flex; align-items: center; gap: .4rem; }
    .vol-icon { font-size: .875rem; color: #71717a; cursor: pointer; }

    /* Lang buttons */
    .lang-row {
      display: flex;
      align-items: center;
      gap: .3rem;
      margin-top: .4rem;
    }
    .lang-label { font-size: .75rem; color: #71717a; margin-right: .2rem; white-space: nowrap; }
    .lang-btn {
      background: #1f1f23;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
      margin: 0;
      width: auto;
    }
    .lang-btn:hover  { border-color: #38bdf8; color: #38bdf8; }
    .lang-btn.active { background: #38bdf8; border-color: #38bdf8; color: #09090b; }

    .source-row {
      display: flex;
      align-items: center;
      gap: .3rem;
      margin-top: .5rem;
    }
    .source-label {
      font-size: .75rem;
      color: #71717a;
      margin-right: .2rem;
      white-space: nowrap;
    }
    .source-btn {
      background: #1f1f23;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .6rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
      margin: 0;
      width: auto;
    }
    .source-btn:hover { border-color: #34d399; color: #34d399; }
    .source-btn.active { background: #34d399; border-color: #34d399; color: #09090b; }

    /* Speed buttons */
    .speed-row {
      display: flex;
      align-items: center;
      gap: .3rem;
      margin-top: .5rem;
    }
    .speed-label {
      font-size: .75rem;
      color: #71717a;
      margin-right: .2rem;
      white-space: nowrap;
    }
    .speed-btn {
      background: #1f1f23;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: .75rem;
      font-weight: 600;
      padding: .25rem .55rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
      margin: 0;
      width: auto;
    }
    .speed-btn:hover { border-color: #818cf8; color: #818cf8; }
    .speed-btn.active { background: #818cf8; border-color: #818cf8; color: #fff; }

    /* Focus styles */
    button:focus-visible, .ctrl-btn:focus-visible, .lang-btn:focus-visible,
    .speed-btn:focus-visible, input[type="range"]:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }

    #btn-edit {
      background: none;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-size: .75rem;
      font-weight: 600;
      padding: .3rem .7rem;
      border-radius: 7px;
      cursor: pointer;
      transition: all .15s;
      width: auto;
      margin: 0;
    }
    #btn-edit:hover { border-color: #818cf8; color: #818cf8; }

    .hidden { display: none !important; }

    /* Popup hint */
    #popup-hint {
      background: rgba(251,191,36,.08);
      border: 1px solid rgba(251,191,36,.3);
      border-radius: 8px;
      padding: .5rem .8rem;
      font-size: .75rem;
      color: #fbbf24;
      text-align: center;
      margin: .5rem 1rem 0;
    }
  </style>
</head>
<body>

  <div id="title-bar">
    <h2>영상 플레이어</h2>
    <button id="btn-edit" class="hidden">자막 편집</button>
    <span id="status-label" aria-live="polite">대기 중...</span>
  </div>

  <div id="popup-hint" class="hidden">팝업이 차단되었습니다. 브라우저에서 팝업을 허용해주세요.</div>

  <div id="video-area">
    <div id="waiting-msg">
      <div class="icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg></div>
      <p>영상을 불러오는 중...</p>
    </div>
    <video id="preview-video" preload="metadata" class="hidden"></video>
  </div>

  <div class="controls">
    <div class="seek-row">
      <span class="time-label" id="time-current">0:00</span>
      <input type="range" id="seek-bar" value="0" min="0" step="0.1" aria-label="탐색" />
      <span class="time-label right" id="time-duration">0:00</span>
    </div>
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-back" title="10초 뒤로" aria-label="10초 뒤로">⏪</button>
      <button class="ctrl-btn play-btn" id="btn-play" aria-label="재생">▶</button>
      <button class="ctrl-btn" id="btn-fwd" title="10초 앞으로" aria-label="10초 앞으로">⏩</button>
      <div class="spacer"></div>
      <div class="volume-row">
        <span class="vol-icon" id="vol-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg></span>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1" aria-label="볼륨" />
      </div>
    </div>
    <div class="lang-row hidden" id="lang-row">
      <span class="lang-label">자막</span>
      <button class="lang-btn" data-lang="off">끄기</button>
      <button class="lang-btn active" data-lang="en">영어</button>
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="both">동시</button>
    </div>
    <div class="source-row hidden" id="source-row">
      <span class="source-label">영상</span>
      <button class="source-btn active" data-source="original">원본</button>
      <button class="source-btn hidden" data-source="final">완성본</button>
    </div>
    <div class="speed-row">
      <span class="speed-label">배속</span>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="3">3x</button>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script>
    const video        = document.getElementById('preview-video');
    const waitingMsg   = document.getElementById('waiting-msg');
    const seekBar      = document.getElementById('seek-bar');
    const btnPlay      = document.getElementById('btn-play');
    const btnBack      = document.getElementById('btn-back');
    const btnFwd       = document.getElementById('btn-fwd');
    const timeCurrent  = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const volumeSlider = document.getElementById('volume-slider');
    const volIcon      = document.getElementById('vol-icon');
    const statusLabel  = document.getElementById('status-label');

    const jobId = getJobId();
    let lastStatus = null;
    let editorWin  = null;
    let currentSource = 'original';

    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    const btnEdit   = document.getElementById('btn-edit');
    const popupHint = document.getElementById('popup-hint');
    btnEdit.addEventListener('click', () => {
      if (!jobId) return;
      if (!editorWin || editorWin.closed) {
        const left = Math.round(screen.width / 2 - 360);
        const top  = Math.round(screen.height / 2 - 400);
        editorWin = window.open(`/editor?job_id=${jobId}`, 'subtitleEditor',
          `width=720,height=800,left=${left},top=${top},resizable=yes`);
        if (!editorWin || editorWin.closed) {
          show(popupHint);
        } else {
          hide(popupHint);
        }
      } else { editorWin.focus(); }
    });

    // ── 초기 상태 조회 + 폴링 ──
    const poller = jobId ? createPoller(jobId, handleStatus) : null;
    if (jobId) {
      api(`/status/${jobId}`)
        .then(d => {
          handleStatus(d);
          if (!TERMINAL.has(d.status)) poller.start();
        })
        .catch(() => poller.start());
    }

    // ── 자막 갱신 수신 (BroadcastChannel + postMessage fallback) ──
    if (jobId) onSubtitleBroadcast(jobId, () => reloadSubtitleTrack());
    window.addEventListener('message', (e) => {
      const { type } = e.data || {};
      if ((type === MSG.RELOAD_SUBTITLE || type === MSG.SUBTITLE_UPDATED) && jobId) {
        reloadSubtitleTrack();
      }
    });

    function reloadSubtitleTrack() {
      if (currentSource !== 'original') return;
      applyLang(currentLang);
    }

    function loadVideo(src) {
      const wasPlaying = !video.paused;
      const currentTime = video.currentTime || 0;
      video.src = src;
      video.load();
      show(video);
      hide(waitingMsg);
      btnPlay.textContent = '▶';
      video.addEventListener('loadedmetadata', function restorePlayback() {
        video.removeEventListener('loadedmetadata', restorePlayback);
        const safeTime = Math.min(currentTime, video.duration || 0);
        if (Number.isFinite(safeTime)) {
          video.currentTime = safeTime;
        }
        if (wasPlaying) {
          video.play().then(() => {
            btnPlay.textContent = '⏸';
            btnPlay.setAttribute('aria-label', '일시정지');
          }).catch(() => {});
        }
      });
    }

    const langRow = document.getElementById('lang-row');
    const sourceRow = document.getElementById('source-row');
    const finalSourceBtn = document.querySelector('[data-source="final"]');

    function updateSourceButtons() {
      document.querySelectorAll('.source-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.source === currentSource);
      });
    }

    function setSource(source) {
      if (!jobId) return;
      currentSource = source;
      if (source === 'final') {
        hide(langRow);
        [...video.querySelectorAll('track')].forEach(t => t.remove());
        loadVideo(`/download/${jobId}`);
      } else {
        show(langRow);
        loadVideo(`/original/${jobId}`);
        applyLang(currentLang);
      }
      updateSourceButtons();
    }

    function handleStatus(data) {
      statusLabel.textContent = fmtStatus(data);

      if (data.status === lastStatus) return;
      lastStatus = data.status;

      if (data.status === STATUS.READY_TO_REVIEW_KO) {
        hasEnglishSubtitle = false;
        updateLangButtons();
        show(btnEdit);
        currentSource = 'original';
        hide(finalSourceBtn);
        show(sourceRow);
        setSource('original');
      }

      if (data.status === STATUS.READY_TO_ENCODE || data.status === STATUS.ENCODING) {
        data.status === STATUS.READY_TO_ENCODE ? show(btnEdit) : hide(btnEdit);
      }

      if (data.status === STATUS.READY_TO_ENCODE) {
        hasEnglishSubtitle = true;
        updateLangButtons();
        currentSource = 'original';
        hide(finalSourceBtn);
        show(sourceRow);
        setSource('original');
      }

      if (data.status === STATUS.ENCODING) {
        hasEnglishSubtitle = true;
        updateLangButtons();
        hide(langRow);
        show(sourceRow);
        hide(finalSourceBtn);
        currentSource = 'original';
        updateSourceButtons();
      }

      if (data.status === STATUS.DONE) {
        hasEnglishSubtitle = true;
        updateLangButtons();
        show(sourceRow);
        show(finalSourceBtn);
        setSource('final');
        statusLabel.textContent = LABELS.ENCODE_DONE;
      }
    }

    // ── 플레이어 컨트롤 ──
    video.addEventListener('loadedmetadata', () => {
      seekBar.max = video.duration;
      timeDuration.textContent = formatTime(video.duration);
    });

    video.addEventListener('timeupdate', () => {
      seekBar.value = video.currentTime;
      timeCurrent.textContent = formatTime(video.currentTime);
      const pct = (video.currentTime / video.duration) * 100 || 0;
      seekBar.style.background = `linear-gradient(to right, #818cf8 ${pct}%, #27272a ${pct}%)`;
    });

    video.addEventListener('ended', () => { btnPlay.textContent = '▶'; });

    seekBar.addEventListener('input', () => { video.currentTime = seekBar.value; });

    function togglePlay() {
      if (video.paused) { video.play(); btnPlay.textContent = '⏸'; btnPlay.setAttribute('aria-label', '일시정지'); }
      else              { video.pause(); btnPlay.textContent = '▶'; btnPlay.setAttribute('aria-label', '재생'); }
    }
    btnPlay.addEventListener('click', togglePlay);

    // 스페이스바 재생/일시정지
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
        e.preventDefault();
        togglePlay();
      }
    });

    btnBack.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
    btnFwd.addEventListener('click',  () => { video.currentTime = Math.min(video.duration, video.currentTime + 10); });

    const volSvg = {
      high: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>',
      low:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>',
      mute: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',
    };
    function updateVolIcon() {
      if (video.muted || volumeSlider.value == 0) volIcon.innerHTML = volSvg.mute;
      else if (volumeSlider.value < 0.5) volIcon.innerHTML = volSvg.low;
      else volIcon.innerHTML = volSvg.high;
    }
    volumeSlider.addEventListener('input', () => {
      video.volume = volumeSlider.value;
      updateVolIcon();
    });
    volIcon.addEventListener('click', () => {
      video.muted = !video.muted;
      updateVolIcon();
    });

    // ── 자막 언어 선택 ──
    let currentLang = 'en';
    let hasEnglishSubtitle = true;

    function updateLangButtons() {
      const enBtn = document.querySelector('.lang-btn[data-lang="en"]');
      const bothBtn = document.querySelector('.lang-btn[data-lang="both"]');
      enBtn.classList.toggle('hidden', !hasEnglishSubtitle);
      bothBtn.classList.toggle('hidden', !hasEnglishSubtitle);
      if (!hasEnglishSubtitle && (currentLang === 'en' || currentLang === 'both')) {
        currentLang = 'ko';
      }
    }

    function subtitleUrl(lang) {
      const t = Date.now();
      if (lang === 'en')   return `/subtitle/${jobId}?t=${t}`;
      if (lang === 'ko')   return `/subtitle_ko/${jobId}?t=${t}`;
      if (lang === 'both') return `/subtitle_combined/${jobId}?t=${t}`;
      return null;
    }

    function applyLang(lang) {
      currentLang = lang;
      if (currentSource !== 'original') return;
      const currentTime = video.currentTime;
      [...video.querySelectorAll('track')].forEach(t => t.remove());
      if (lang !== 'off') {
        const track = document.createElement('track');
        track.kind    = 'subtitles';
        track.srclang = lang === 'ko' ? 'ko' : 'en';
        track.src     = subtitleUrl(lang);
        track.default = true;
        video.appendChild(track);
        video.currentTime = currentTime;
        setTimeout(() => {
          if (video.textTracks[0]) video.textTracks[0].mode = 'showing';
        }, 100);
      }
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });

    updateLangButtons();

    document.querySelectorAll('.source-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('hidden')) return;
        setSource(btn.dataset.source);
      });
    });

    // ── 배속 조절 ──
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        video.playbackRate = parseFloat(btn.dataset.speed);
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m   = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

  </script>
</body>
</html>

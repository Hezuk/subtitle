<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>영상 자막 생성기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .3rem;
      color: #fafafa;
    }
    .subtitle {
      font-size: .875rem;
      color: #71717a;
      margin-bottom: 2rem;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed #27272a;
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #818cf8;
      background: rgba(129,140,248,.05);
    }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .drop-title { font-size: 1rem; font-weight: 600; margin-bottom: .3rem; }
    .drop-hint { font-size: .75rem; color: #71717a; }

    #file-bar {
      background: #1f1f23;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: .6rem .9rem;
      font-size: .875rem;
      color: #818cf8;
      word-break: break-all;
      cursor: pointer;
      transition: border-color .2s;
      position: relative;
    }
    #file-bar:hover { border-color: #818cf8; }
    #file-bar input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    #file-bar-name { margin-bottom: .1rem; font-weight: 600; }
    #file-bar-size { color: #71717a; font-size: .75rem; }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: .85rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }

    #upload-btn {
      background: #818cf8;
      color: #fff;
    }
    #upload-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    #upload-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    #open-player-btn {
      background: #1f1f23;
      color: #a1a1aa;
      border: 1px solid #27272a;
      font-size: .875rem;
      padding: .6rem;
      margin-top: .6rem;
    }
    #open-player-btn:hover { border-color: #818cf8; color: #818cf8; }

    /* Progress */
    #progress-section { margin-top: 1.25rem; }
    .status-msg {
      font-size: .875rem;
      color: #a1a1aa;
      margin-bottom: .6rem;
      min-height: 1.3em;
      text-align: center;
    }
    .progress-bar-bg {
      background: #27272a;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #818cf8;
      border-radius: 99px;
      width: 0%;
      transition: width .4s ease;
    }
    .steps {
      display: flex;
      justify-content: space-between;
      margin-top: .75rem;
      gap: .4rem;
    }
    .step {
      flex: 1;
      text-align: center;
      font-size: .75rem;
      color: #52525b;
      padding: .35rem .15rem;
      border-radius: 6px;
      background: #1f1f23;
      transition: all .3s;
    }
    .step.active { color: #818cf8; background: rgba(129,140,248,.12); }
    .step.done   { color: #34d399; background: rgba(52,211,153,.1); }

    #review-badge {
      margin-top: 1rem;
      background: rgba(251,191,36,.08);
      border: 1px solid rgba(251,191,36,.3);
      border-radius: 10px;
      padding: .8rem 1rem;
      font-size: .875rem;
      color: #fbbf24;
      text-align: center;
    }

    #cancel-btn {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248,113,113,.3);
      font-size: .875rem;
      padding: .55rem;
      margin-top: .5rem;
    }
    #cancel-btn:hover:not(:disabled) { background: rgba(248,113,113,.08); border-color: #f87171; }
    #cancel-btn:disabled { opacity: .4; cursor: not-allowed; }

    #retry-btn {
      padding: .75rem 2rem; border: none; border-radius: 8px;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      background: #fbbf24; color: #09090b;
      transition: opacity .15s, transform .15s;
    }
    #retry-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    #retry-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    #encode-btn {
      background: #818cf8;
      color: #fff;
    }
    #encode-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    #encode-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    #done-badge {
      margin-top: 1rem;
      background: rgba(52,211,153,.08);
      border: 1px solid rgba(52,211,153,.3);
      border-radius: 10px;
      padding: .8rem 1rem;
      text-align: center;
      font-size: .875rem;
      color: #34d399;
      font-weight: 700;
    }

    #download-btn {
      background: #34d399;
      color: #09090b;
      font-weight: 700;
    }
    #download-btn:hover { opacity: .9; transform: translateY(-1px); }

    #error-box {
      margin-top: 1rem;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 1rem;
      font-size: .875rem;
      color: #fca5a5;
      word-break: break-word;
    }

    .reset-link {
      text-align: center;
      margin-top: 1rem;
      font-size: .75rem;
      color: #71717a;
      cursor: pointer;
      text-decoration: underline;
    }
    .reset-link:hover { color: #a1a1aa; }

    #edit-btn {
      background: #1f1f23;
      border: 1px solid #27272a;
      color: #a1a1aa;
      margin-top: .6rem;
    }

    .hidden { display: none !important; }
    .file-bar-disabled { pointer-events: none; opacity: .5; }

    /* Focus styles */
    button:focus-visible, .reset-link:focus-visible, #drop-zone:focus-visible {
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }

    /* Popup hint */
    #popup-hint {
      margin-top: .6rem;
      background: rgba(251,191,36,.08);
      border: 1px solid rgba(251,191,36,.3);
      border-radius: 8px;
      padding: .6rem .8rem;
      font-size: .75rem;
      color: #fbbf24;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>영상 자막 생성기</h1>
    <p class="subtitle">동영상을 업로드하면 영어 자막이 자동으로 삽입됩니다</p>

    <!-- Drop zone -->
    <div id="drop-zone">
      <input type="file" id="file-input" accept="video/*" />
      <div class="drop-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
      <div class="drop-title">동영상 파일을 선택하거나 드래그하세요</div>
      <div class="drop-hint">mp4, mov, avi, mkv 등 지원</div>
    </div>

    <!-- File bar -->
    <div id="file-bar" class="hidden">
      <input type="file" id="file-input2" accept="video/*" />
      <div id="file-bar-name"></div>
      <div id="file-bar-size"></div>
    </div>

    <button id="upload-btn" disabled aria-label="자막 생성 시작">자막 생성 시작</button>
    <button id="cancel-btn" class="hidden" aria-label="작업 취소">취소</button>
    <button id="open-player-btn" class="hidden" aria-label="플레이어 창 열기">플레이어 창 열기</button>
    <div id="popup-hint" class="hidden">팝업이 차단되었습니다. 브라우저 주소창의 팝업 차단 아이콘을 클릭하여 허용해주세요.</div>

    <!-- Progress -->
    <div id="progress-section" class="hidden">
      <p class="status-msg" id="status-msg" aria-live="polite">처리 중...</p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="steps">
        <div class="step" id="step-transcribe">음성인식</div>
        <div class="step" id="step-translate">번역</div>
        <div class="step" id="step-review">검토</div>
        <div class="step" id="step-encode">인코딩</div>
        <div class="step" id="step-done">완료</div>
      </div>
    </div>

    <div id="review-badge" class="hidden">자막을 확인하고 필요하면 편집한 후 번인을 시작하세요</div>
    <button id="edit-btn" class="hidden">자막 편집</button>
    <button id="retry-btn" class="hidden">번역 재시도</button>
    <button id="encode-btn" class="hidden">번인 시작</button>
    <div id="done-badge" class="hidden">영어 자막 생성 완료!</div>
    <button id="download-btn" class="hidden">자막 영상 다운로드</button>
    <div id="error-box" class="hidden" role="alert"></div>

    <a class="reset-link hidden" id="reset-link" onclick="resetUI()">새 파일 처리</a>
  </div>

  <script src="/shared.js"></script>
  <script>
    const fileInput    = document.getElementById('file-input');
    const fileInput2   = document.getElementById('file-input2');
    const dropZone     = document.getElementById('drop-zone');
    const fileBar      = document.getElementById('file-bar');
    const fileBarName  = document.getElementById('file-bar-name');
    const fileBarSize  = document.getElementById('file-bar-size');
    const uploadBtn    = document.getElementById('upload-btn');
    const openPlayerBtn= document.getElementById('open-player-btn');
    const progressSec  = document.getElementById('progress-section');
    const statusMsg    = document.getElementById('status-msg');
    const progressFill = document.getElementById('progress-fill');
    const reviewBadge  = document.getElementById('review-badge');
    const editBtn      = document.getElementById('edit-btn');
    const cancelBtn    = document.getElementById('cancel-btn');
    const retryBtn     = document.getElementById('retry-btn');
    const encodeBtn    = document.getElementById('encode-btn');
    const doneBadge    = document.getElementById('done-badge');
    const downloadBtn  = document.getElementById('download-btn');
    const errorBox     = document.getElementById('error-box');
    const resetLink    = document.getElementById('reset-link');
    const popupHint    = document.getElementById('popup-hint');

    let currentJobId = null;
    let poller       = null;
    let playerWindow = null;
    let playerOpened = false;

    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    // ── 팝업 열기 헬퍼 ──
    function tryOpen(url, name, w, h) {
      const left = Math.round(screen.width / 2 - w / 2);
      const top  = Math.round(screen.height / 2 - h / 2);
      const win = window.open(url, name,
        `width=${w},height=${h},left=${left},top=${top},resizable=yes`);
      if (!win || win.closed) {
        show(popupHint);
        return null;
      }
      hide(popupHint);
      return win;
    }

    // ── 플레이어 창 열기 ──
    function openPlayer() {
      if (!playerWindow || playerWindow.closed) {
        const url = currentJobId ? `/player?job_id=${currentJobId}` : '/player';
        playerWindow = tryOpen(url, 'videoPlayer', 960, 680);
      } else {
        playerWindow.focus();
      }
    }

    openPlayerBtn.addEventListener('click', openPlayer);

    // ── Drag & drop ──
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change',  () => { if (fileInput.files[0])  setFile(fileInput.files[0]); });
    fileInput2.addEventListener('change', () => { if (fileInput2.files[0]) setFile(fileInput2.files[0]); });

    function setFile(file) {
      const ext = file.name.includes('.') ? '.' + file.name.split('.').pop().toLowerCase() : '';
      if (!UPLOAD.ALLOWED_EXTS.includes(ext)) {
        showError(`${LABELS.UNSUPPORTED_FMT} (${UPLOAD.ALLOWED_EXTS.join(', ')})`);
        return;
      }
      if (file.size > UPLOAD.MAX_MB * 1024 * 1024) {
        showError(`${LABELS.FILE_TOO_LARGE} (최대 ${UPLOAD.MAX_MB}MB)`);
        return;
      }

      uploadBtn._file     = file;
      uploadBtn._filename = file.name;
      uploadBtn.disabled  = false;

      hide(dropZone);
      show(fileBar);
      fileBarName.textContent = file.name;
      fileBarSize.textContent = `${(file.size / 1024 / 1024).toFixed(1)} MB — ${LABELS.CLICK_TO_CHANGE}`;

      show(openPlayerBtn);
    }

    uploadBtn.addEventListener('click', async () => {
      const file = uploadBtn._file;
      if (!file) return;
      uploadBtn.disabled    = true;
      uploadBtn.innerHTML   = `<span class="spinner"></span>${LABELS.UPLOADING}`;
      show(progressSec);
      fileBar.classList.add('file-bar-disabled');

      const form = new FormData();
      form.append('file', file);
      try {
        const data = await api('/upload', { method: 'POST', body: form });
        currentJobId = data.job_id;
        setupBroadcast(currentJobId);
        poller = createPoller(currentJobId, updateUI);
        poller.start();
      } catch (err) {
        showError(err.message);
        uploadBtn.disabled    = false;
        uploadBtn.textContent = LABELS.START;
      }
    });

    function updateUI(data) {
      statusMsg.textContent    = fmtStatus(data);
      const pct = data.progress ?? guessProgress(data.status);
      progressFill.style.width = pct + '%';

      // 단계 표시 업데이트
      const order = Object.keys(STEP_MAP);
      const cur   = order.indexOf(data.status);
      Object.entries(STEP_MAP).forEach(([st, id]) => {
        const el   = document.getElementById(id);
        const mine = order.indexOf(st);
        el.className = 'step';
        if (mine < cur)   el.classList.add('done');
        if (mine === cur) el.classList.add('active');
      });

      // 취소 버튼: 진행 중일 때만 표시
      const inProgress = !TERMINAL.has(data.status) && data.status !== STATUS.READY_TO_ENCODE;
      inProgress ? show(cancelBtn) : hide(cancelBtn);

      if (data.status === STATUS.READY_TO_TRANSLATE) {
        hide(uploadBtn);
        hide(cancelBtn);
        showError(data.message);
        retryBtn.disabled    = false;
        retryBtn.textContent = '번역 재시도';
        show(retryBtn);
        show(resetLink);
      }

      if (data.status === STATUS.READY_TO_ENCODE) {
        hide(retryBtn);
        hide(uploadBtn);
        show(reviewBadge);
        show(editBtn);
        encodeBtn.disabled    = false;
        encodeBtn.textContent = LABELS.ENCODE_START;
        show(encodeBtn);
        if (data.message && data.message.includes('인코딩 실패')) showError(data.message);
        if (!playerOpened) { playerOpened = true; openPlayer(); }
      }

      if (data.status === STATUS.ENCODING) {
        hide(reviewBadge);
        hide(editBtn);
        hide(encodeBtn);
      }

      if (data.status === STATUS.DONE) {
        document.getElementById('step-done').classList.add('done');
        show(doneBadge);
        show(downloadBtn);
        show(resetLink);
        if (!playerOpened) { playerOpened = true; openPlayer(); }

        const filename = uploadBtn._filename || 'video.mp4';
        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.href     = `/download/${currentJobId}`;
          a.download = filename.replace(/\.[^.]+$/, '_english.mp4');
          a.click();
        };
      }

      if (data.status === STATUS.ERROR || data.status === STATUS.CANCELLED) {
        if (data.status === STATUS.ERROR) showError(data.message);
        show(resetLink);
        uploadBtn.disabled    = false;
        uploadBtn.textContent = LABELS.NEW_FILE;
        show(uploadBtn);
      }
    }

    function guessProgress(status) {
      return { queued: 2, transcribing: 8, translating: 35, reviewing: 60, ready_to_translate: 30, ready_to_encode: 80, encoding: 85, done: 100 }[status] ?? 0;
    }

    // 번역 재시도
    retryBtn.addEventListener('click', async () => {
      if (!currentJobId) return;
      retryBtn.disabled  = true;
      retryBtn.innerHTML = `<span class="spinner"></span>재시도 중...`;
      hide(errorBox);
      try {
        await apiPost(`/retry/${currentJobId}`);
        hide(retryBtn);
        poller = createPoller(currentJobId, updateUI);
        poller.start();
      } catch (err) {
        showError(err.message);
        retryBtn.disabled    = false;
        retryBtn.textContent = '번역 재시도';
      }
    });

    // 편집 창 열기
    let editorWindow = null;
    editBtn.addEventListener('click', () => {
      if (!currentJobId) return;
      if (!editorWindow || editorWindow.closed) {
        editorWindow = tryOpen(`/editor?job_id=${currentJobId}`, 'subtitleEditor', 720, 800);
      } else {
        editorWindow.focus();
      }
    });

    // postMessage fallback: editor → index → player
    window.addEventListener('message', (e) => {
      if (e.data?.type === MSG.SUBTITLE_UPDATED && playerWindow && !playerWindow.closed) {
        playerWindow.postMessage({ type: MSG.RELOAD_SUBTITLE }, '*');
      }
    });

    // BroadcastChannel: 자막 갱신 수신 → player에 중계
    function setupBroadcast(jobId) {
      onSubtitleBroadcast(jobId, () => {
        if (playerWindow && !playerWindow.closed) {
          playerWindow.postMessage({ type: MSG.RELOAD_SUBTITLE }, '*');
        }
      });
    }

    cancelBtn.addEventListener('click', async () => {
      if (!currentJobId) return;
      cancelBtn.disabled    = true;
      cancelBtn.textContent = LABELS.CANCELLING;
      try {
        await api(`/cancel/${currentJobId}`, { method: 'POST' });
      } catch (err) {
        showError(err.message);
      }
    });

    encodeBtn.addEventListener('click', async () => {
      encodeBtn.disabled    = true;
      encodeBtn.innerHTML   = `<span class="spinner"></span>${LABELS.ENCODING}`;
      hide(reviewBadge);
      hide(editBtn);
      try {
        await api(`/encode/${currentJobId}`, { method: 'POST' });
        poller = createPoller(currentJobId, updateUI);
        poller.start();
      } catch (err) {
        showError(err.message);
        encodeBtn.disabled    = false;
        encodeBtn.textContent = LABELS.ENCODE_START;
        show(reviewBadge);
        show(editBtn);
      }
    });

    function showError(msg) {
      show(errorBox);
      errorBox.textContent = msg;
    }

    function resetUI() {
      if (poller) poller.stop();
      currentJobId = null;
      playerOpened = false;
      if (playerWindow && !playerWindow.closed) playerWindow.close();
      playerWindow = null;
      if (editorWindow && !editorWindow.closed) editorWindow.close();
      editorWindow = null;

      uploadBtn._file       = null;
      uploadBtn.disabled    = true;
      uploadBtn.textContent = LABELS.START;
      show(uploadBtn);

      show(dropZone);
      hide(fileBar);
      fileBar.classList.remove('file-bar-disabled');
      hide(openPlayerBtn);
      hide(popupHint);
      hide(progressSec);
      hide(reviewBadge);
      hide(editBtn);
      hide(cancelBtn);
      cancelBtn.disabled    = false;
      cancelBtn.textContent = LABELS.CANCEL;
      hide(encodeBtn);
      encodeBtn.disabled    = false;
      encodeBtn.textContent = LABELS.ENCODE_START;
      hide(doneBadge);
      hide(downloadBtn);
      hide(errorBox);
      hide(resetLink);

      progressFill.style.width = '0%';
      statusMsg.textContent    = LABELS.PROCESSING;

      Object.values(STEP_MAP).forEach(id => {
        document.getElementById(id).className = 'step';
      });
      fileInput.value  = '';
      fileInput2.value = '';
    }
  </script>
</body>
</html>

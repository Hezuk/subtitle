<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Subtitle Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .3rem;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: .85rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed #2d3148;
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #818cf8;
      background: rgba(129,140,248,.05);
    }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .drop-title { font-size: 1rem; font-weight: 600; margin-bottom: .3rem; }
    .drop-hint { font-size: .8rem; color: #64748b; }

    #file-name {
      margin-top: 1rem;
      font-size: .85rem;
      color: #818cf8;
      text-align: center;
      min-height: 1.2em;
      word-break: break-all;
    }

    /* Button */
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: .85rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    #upload-btn {
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      color: #fff;
    }
    #upload-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    #upload-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    #download-section {
      display: none;
      margin-top: 1.5rem;
      background: rgba(52,211,153,.08);
      border: 1px solid rgba(52,211,153,.3);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    #download-section .done-icon { font-size: 2.5rem; margin-bottom: .5rem; }
    #download-section .done-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #34d399;
      margin-bottom: .25rem;
    }
    #download-section .done-desc {
      font-size: .8rem;
      color: #64748b;
      margin-bottom: 1.2rem;
    }
    #download-btn {
      background: linear-gradient(135deg, #34d399, #059669);
      color: #fff;
      font-size: 1.05rem;
      padding: 1rem;
      border-radius: 10px;
      border: none;
      width: 100%;
      cursor: pointer;
      font-weight: 700;
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(52,211,153,.3);
    }
    #download-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(52,211,153,.4); }

    /* Progress */
    #progress-section { display: none; margin-top: 1.5rem; }

    .status-msg {
      font-size: .9rem;
      color: #94a3b8;
      margin-bottom: .75rem;
      min-height: 1.3em;
      text-align: center;
    }

    .progress-bar-bg {
      background: #2d3148;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #818cf8, #38bdf8);
      border-radius: 99px;
      width: 0%;
      transition: width .4s ease;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      gap: .5rem;
    }
    .step {
      flex: 1;
      text-align: center;
      font-size: .7rem;
      color: #374151;
      padding: .4rem .2rem;
      border-radius: 6px;
      background: #1e2233;
      transition: all .3s;
    }
    .step.active { color: #818cf8; background: rgba(129,140,248,.12); }
    .step.done   { color: #34d399; background: rgba(52,211,153,.1); }

    /* Error */
    #error-box {
      display: none;
      margin-top: 1rem;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 1rem;
      font-size: .85rem;
      color: #fca5a5;
      word-break: break-word;
    }

    .reset-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      font-size: .8rem;
      color: #64748b;
      cursor: pointer;
      text-decoration: underline;
    }
    .reset-link:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 Video Subtitle Generator</h1>
    <p class="subtitle">동영상을 업로드하면 영어 자막이 자동으로 삽입됩니다</p>

    <!-- Upload section -->
    <div id="upload-section">
      <div id="drop-zone">
        <input type="file" id="file-input" accept="video/*" />
        <div class="drop-icon">📁</div>
        <div class="drop-title">동영상 파일을 선택하거나 드래그하세요</div>
        <div class="drop-hint">mp4, mov, avi, mkv 등 지원</div>
      </div>
      <div id="file-name"></div>
      <button id="upload-btn" disabled>자막 생성 시작</button>
    </div>

    <!-- Progress section -->
    <div id="progress-section">
      <p class="status-msg" id="status-msg">처리 중...</p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="steps">
        <div class="step" id="step-transcribe">🎤 음성 인식</div>
        <div class="step" id="step-translate">🌍 번역</div>
        <div class="step" id="step-encode">🎬 인코딩</div>
        <div class="step" id="step-done">✅ 완료</div>
      </div>
    </div>

    <!-- Error -->
    <div id="error-box"></div>

    <!-- Download -->
    <div id="download-section">
      <div class="done-icon">🎉</div>
      <div class="done-title">영어 자막 생성 완료!</div>
      <div class="done-desc" id="done-desc">영상에 영어 자막이 삽입되었습니다</div>
      <button id="download-btn">⬇️ 자막 영상 다운로드</button>
    </div>

    <a class="reset-link" id="reset-link" style="display:none" onclick="resetUI()">새 파일 처리하기</a>
  </div>

  <script>
    const fileInput   = document.getElementById('file-input');
    const dropZone    = document.getElementById('drop-zone');
    const fileNameEl  = document.getElementById('file-name');
    const uploadBtn   = document.getElementById('upload-btn');
    const uploadSec   = document.getElementById('upload-section');
    const progressSec = document.getElementById('progress-section');
    const statusMsg   = document.getElementById('status-msg');
    const progressFill= document.getElementById('progress-fill');
    const downloadSec = document.getElementById('download-section');
    const downloadBtn = document.getElementById('download-btn');
    const errorBox    = document.getElementById('error-box');
    const resetLink   = document.getElementById('reset-link');

    const steps = {
      transcribing: 'step-transcribe',
      translating:  'step-translate',
      encoding:     'step-encode',
      done:         'step-done',
    };

    let currentJobId = null;
    let pollTimer    = null;

    // Drag & drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(file) {
      fileNameEl.textContent = `📎 ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
      uploadBtn.disabled = false;
      uploadBtn._file = file;
      uploadBtn._filename = file.name;
    }

    uploadBtn.addEventListener('click', async () => {
      const file = uploadBtn._file;
      if (!file) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = '업로드 중...';

      const form = new FormData();
      form.append('file', file);

      try {
        const res  = await fetch('/upload', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Upload failed');
        currentJobId = data.job_id;
        showProgress();
        pollStatus();
      } catch (err) {
        showError(err.message);
        uploadBtn.disabled = false;
        uploadBtn.textContent = '자막 생성 시작';
      }
    });

    function showProgress() {
      uploadSec.style.display   = 'none';
      progressSec.style.display = 'block';
    }

    function pollStatus() {
      pollTimer = setTimeout(async () => {
        try {
          const res  = await fetch(`/status/${currentJobId}`);
          const data = await res.json();
          updateUI(data);
          if (!['done', 'error'].includes(data.status)) pollStatus();
        } catch {
          pollStatus();
        }
      }, 2000);
    }

    function updateUI(data) {
      statusMsg.textContent = data.message || data.status;

      // Progress bar
      const pct = data.progress ?? guessProgress(data.status);
      progressFill.style.width = pct + '%';

      // Steps
      Object.entries(steps).forEach(([st, id]) => {
        const el = document.getElementById(id);
        el.className = 'step';
        const order = Object.keys(steps);
        const cur   = order.indexOf(data.status);
        const mine  = order.indexOf(st);
        if (mine < cur)  el.classList.add('done');
        if (mine === cur) el.classList.add('active');
      });

      if (data.status === 'done') {
        downloadSec.style.display = 'block';
        resetLink.style.display   = 'block';
        const filename = uploadBtn._filename || 'subtitled_english.mp4';
        document.getElementById('done-desc').textContent = `${filename} → 영어 자막 삽입 완료`;
        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = `/download/${currentJobId}`;
          a.download = filename.replace(/\.[^.]+$/, '_english.mp4');
          a.click();
        };
        document.getElementById('step-done').classList.add('done');
      }

      if (data.status === 'error') {
        showError(data.message);
        resetLink.style.display = 'block';
      }
    }

    function guessProgress(status) {
      return { queued: 5, transcribing: 20, translating: 60, encoding: 85, done: 100 }[status] ?? 0;
    }

    function showError(msg) {
      errorBox.style.display = 'block';
      errorBox.textContent   = msg;
    }

    function resetUI() {
      clearTimeout(pollTimer);
      currentJobId = null;
      uploadBtn._file = null;
      uploadBtn.disabled = true;
      uploadBtn.textContent = '자막 생성 시작';
      fileNameEl.textContent = '';
      uploadSec.style.display   = 'block';
      progressSec.style.display = 'none';
      downloadSec.style.display = 'none';
      resetLink.style.display   = 'none';
      errorBox.style.display    = 'none';
      progressFill.style.width  = '0%';
      statusMsg.textContent     = '처리 중...';
      Object.values(steps).forEach(id => {
        document.getElementById(id).className = 'step';
      });
      fileInput.value = '';
    }
  </script>
</body>
</html>

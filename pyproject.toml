[project]
name = "subtitle"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "aiofiles>=23.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "openai-whisper>=20230314",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
